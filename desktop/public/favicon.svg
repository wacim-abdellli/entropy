<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="entropy-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="entropy-grad-chaos" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="1" />
    </linearGradient>
  </defs>

  {/* Background Slate Circle for Favicon/Taskbar clarity */}
  <rect width="100" height="100" rx="22" fill="#0b0f17"/>

  {/* Chaotic Swirling Strands (Order out of Chaos) */}
  <path d="M 12 30 C 22 18, 38 22, 48 32 C 34 38, 20 48, 14 62 C 24 78, 42 74, 52 68" stroke="url(#entropy-grad-chaos)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 18 20 C 30 12, 44 26, 36 42 C 26 56, 12 68, 28 82" stroke="url(#entropy-grad-chaos)" stroke-width="3" stroke-dasharray="4 3" stroke-linecap="round" fill="none"/>

  {/* Sharp Geometric Crystalline 'E' */}
  <path d="M 45 22 L 88 22 L 72 36 L 45 36 Z" fill="url(#entropy-grad-primary)"/>
  <path d="M 45 44 L 78 44 L 66 56 L 45 56 Z" fill="url(#entropy-grad-primary)"/>
  <path d="M 45 64 L 88 64 L 72 78 L 45 78 Z" fill="url(#entropy-grad-primary)"/>
  <path d="M 42 22 L 52 22 L 52 78 L 42 78 Z" fill="url(#entropy-grad-primary)"/>

  {/* Accent Nodes */}
  <circle cx="88" cy="22" r="3" fill="#38bdf8"/>
  <circle cx="78" cy="44" r="2.5" fill="#60a5fa"/>
  <circle cx="88" cy="64" r="3" fill="#a78bfa"/>
</svg>